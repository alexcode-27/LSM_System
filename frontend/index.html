<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>LSM System — Rankings Irapuato</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0e16;
      --panel: #10151f;
      --line: #232a38;
      --text: #e9ecf1;
      --text-dim: #8b93a5;
      --club-red: #c8102e;
      --club-red-bright: #ea2e4d;
      --gold: #d4a017;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .topbar {
      background: linear-gradient(90deg, var(--club-red) 0%, #8a0c22 100%);
      padding: 0.35rem 0;
    }
    header {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.75rem 1.5rem 1.25rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    h1 {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 1.9rem;
      letter-spacing: 0.01em;
      margin: 0;
      color: #fff;
    }
    h1 span { color: var(--club-red-bright); }
    .subtitle {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-top: 0.15rem;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 3rem; }
    .controls {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 1.25rem 0 1rem;
      color: var(--text-dim);
      font-size: 0.85rem;
    }
    select {
      background: var(--panel);
      color: var(--text);
      padding: 0.4rem 0.7rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-family: inherit;
      font-size: 0.85rem;
    }
    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    table { border-collapse: collapse; width: 100%; }
    thead th {
      text-align: left;
      padding: 0.7rem 0.85rem;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    thead th:hover { color: var(--club-red-bright); }
    thead th.sorted { color: var(--gold); }
    thead th .arrow { margin-left: 0.25rem; opacity: 0.7; }
    tbody td {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--line);
      font-size: 0.9rem;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: rgba(200, 16, 46, 0.06); }
    tbody tr.leader td:first-child {
      box-shadow: inset 3px 0 0 var(--gold);
      padding-left: calc(0.85rem - 3px);
    }
    td.player { font-weight: 500; }
    .jersey {
      display: inline-block;
      min-width: 1.6rem;
      text-align: center;
      background: var(--line);
      color: var(--text-dim);
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.05rem 0.35rem;
      margin-right: 0.5rem;
    }
    td.num { text-align: right; }
    th.num-col { text-align: right; }
    .footer-note {
      margin-top: 1rem;
      font-size: 0.78rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="topbar"></div>
  <header>
    <div>
      <h1>LSM <span>System</span></h1>
      <div class="subtitle">Rankings — Club Deportivo Irapuato · Temporada 2026-2027</div>
    </div>
  </header>

  <main>
    <div class="controls">
      <span>Ordenar por</span>
      <select id="criteria">
        <option value="goals">Goles</option>
        <option value="goals_per_match">Goles por partido</option>
        <option value="minutes_played">Minutos jugados</option>
        <option value="minutes_percentage">% de minutos</option>
        <option value="starts">Titularidades</option>
      </select>
      <span style="margin-left:auto; opacity:0.7;">Clic en un encabezado para ordenar</span>
    </div>

    <div class="table-wrap">
      <table id="rankings-table">
        <thead>
          <tr>
            <th data-key="full_name">Jugador</th>
            <th data-key="position">Posición</th>
            <th data-key="matches_played" class="num-col">PJ</th>
            <th data-key="goals" class="num-col">Goles</th>
            <th data-key="goals_per_match" class="num-col">Goles/PJ</th>
            <th data-key="minutes_played" class="num-col">Min.</th>
            <th data-key="minutes_percentage" class="num-col">% Min.</th>
            <th data-key="starts" class="num-col">Titular.</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="footer-note">El jugador con el valor más alto en la columna activa se marca con un borde dorado.</div>
  </main>

  <script>
    const API_BASE = "http://localhost:8000/api/rankings";
    const tbody = document.querySelector("#rankings-table tbody");
    const criteriaSelect = document.getElementById("criteria");
    const headers = document.querySelectorAll("#rankings-table thead th");

    let currentData = [];
    let sortKey = "goals";
    let sortDir = "desc";

    async function fetchRankings() {
      const res = await fetch(`${API_BASE}?criteria=${criteriaSelect.value}&limit=50`);
      currentData = await res.json();
      render();
    }

    function render() {
      const sorted = [...currentData].sort((a, b) => {
        const av = a[sortKey], bv = b[sortKey];
        if (typeof av === "string") {
          return sortDir === "asc" ? av.localeCompare(bv) : bv.localeCompare(av);
        }
        return sortDir === "asc" ? av - bv : bv - av;
      });

      const maxVal = Math.max(...sorted.map(p => typeof p[sortKey] === "number" ? p[sortKey] : -Infinity));

      tbody.innerHTML = "";
      sorted.forEach(p => {
        const row = document.createElement("tr");
        if (typeof p[sortKey] === "number" && p[sortKey] === maxVal && maxVal > 0) {
          row.classList.add("leader");
        }
        row.innerHTML = `
          <td class="player">${p.jersey_number != null ? `<span class="jersey">${p.jersey_number}</span>` : ""}${p.full_name}</td>
          <td>${p.position ?? "—"}</td>
          <td class="num">${p.matches_played}</td>
          <td class="num">${p.goals}</td>
          <td class="num">${p.goals_per_match}</td>
          <td class="num">${p.minutes_played}</td>
          <td class="num">${p.minutes_percentage}%</td>
          <td class="num">${p.starts}</td>
        `;
        tbody.appendChild(row);
      });

      headers.forEach(h => {
        h.classList.toggle("sorted", h.dataset.key === sortKey);
        const arrow = h.querySelector(".arrow");
        if (arrow) arrow.remove();
        if (h.dataset.key === sortKey) {
          const span = document.createElement("span");
          span.className = "arrow";
          span.textContent = sortDir === "asc" ? "↑" : "↓";
          h.appendChild(span);
        }
      });
    }

    headers.forEach(h => {
      h.addEventListener("click", () => {
        const key = h.dataset.key;
        if (sortKey === key) {
          sortDir = sortDir === "asc" ? "desc" : "asc";
        } else {
          sortKey = key;
          sortDir = "desc";
        }
        render();
      });
    });

    criteriaSelect.addEventListener("change", () => {
      sortKey = criteriaSelect.value;
      sortDir = "desc";
      fetchRankings();
    });

    fetchRankings();
  </script>
</body>
</html>
